name: FinBooksOS CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:calculations
      - run: npm run test:ledger
      - run: npm run test:india-tax
      - name: Capture typecheck diagnostics
        if: always()
        run: npm run typecheck > typecheck.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-typecheck
          path: typecheck.log
      - run: npm run typecheck
      - run: npm run build
